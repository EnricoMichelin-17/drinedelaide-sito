<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Cassa posti – Drin e Delaide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: pianta della sala vista dall'alto a sinistra (pubblico), foglio simulato a destra (gestione); su telefono uno sotto l'altro */
:root{
  --bg:#eef1fb; --bg2:#fdf6e3; --surface:rgba(255,255,255,.78); --surface-solid:#ffffff; --ink:#151a33; --muted:#59607e;
  --line:rgba(30,40,90,.12); --accent:#2b55ff; --accent-ink:#ffffff;
  /* colori della sala: restano uguali nei due temi perché riproducono la sala vera */
  --seat:#3366ff; --seat-hi:#5c86ff; --seat-back:#1d3fd0; --seat-taken:#18215e; --seat-taken-back:#0b1036;
  --floor:#d3d8dd; --floor-hi:#e2e6ea; --aisle:#f6c637; --aisle-hi:#ffd95a; --aisle-edge:#b3bfba;
  --brick:#c26a4e; --brick-light:#f0d9cb;
  --curtain:#e2ad2c; --curtain-hi:#ffd25e; --curtain-dark:#a8771a; --deck:#f3ebdc; --deck-front:#ffffff; --stair:#c4834f; --stair-dark:#93592f;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1224; --bg2:#1d1830; --surface:rgba(30,34,58,.72); --surface-solid:#1d2138; --ink:#eef0fa; --muted:#a6acca;
  --line:rgba(200,210,255,.14); --accent:#7f9bff; --accent-ink:#0f1224; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1224; --bg2:#1d1830; --surface:rgba(30,34,58,.72); --surface-solid:#1d2138; --ink:#eef0fa; --muted:#a6acca;
  --line:rgba(200,210,255,.14); --accent:#7f9bff; --accent-ink:#0f1224; color-scheme:dark}
*{box-sizing:border-box}
html{min-height:100%}
body{background:var(--bg);background-image:radial-gradient(1000px 600px at 10% -10%,color-mix(in srgb,var(--accent) 18%,transparent),transparent 70%),
  radial-gradient(900px 600px at 100% 10%,color-mix(in srgb,var(--aisle) 22%,transparent),transparent 70%);
  background-attachment:fixed;color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:30px 44px}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:24px}
header h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,4.4vw,42px);line-height:1.05;margin:0 0 8px;text-wrap:balance;letter-spacing:-.01em}
header p{margin:0;color:var(--muted);max-width:65ch}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;
  color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);padding:4px 10px;border-radius:999px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:22px;
  backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);
  box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 18px 40px -24px rgba(20,30,90,.35)}
.panel h2{font-family:var(--display);font-weight:600;font-size:20px;margin:0 0 4px}
.panel .sub{color:var(--muted);font-size:13.5px;margin:0 0 16px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;font-variant-numeric:tabular-nums}
.stat{flex:1 1 110px;font-size:12.5px;color:var(--muted);padding:10px 14px;border-radius:18px;background:var(--surface-solid);border:1px solid var(--line)}
.stat b{display:block;font-family:var(--display);font-size:26px;line-height:1.1;color:var(--ink)}
.stat.t b{color:var(--seat-taken)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .stat.t b{color:#9fb0ff}}
:root[data-theme="dark"] .stat.t b{color:#9fb0ff}
.stat.f b{color:var(--accent)}

/* ---------- la sala ---------- */
.hall{overflow-x:auto;padding:4px 2px 6px}
.room{position:relative;min-width:640px;border-radius:30px;padding:12px;
  background:repeating-linear-gradient(0deg,var(--brick) 0 9px,var(--brick-light) 9px 13px);
  box-shadow:0 22px 40px -22px rgba(90,40,20,.55)}
.inside{background:linear-gradient(180deg,var(--aisle-hi),var(--aisle));border-radius:20px;overflow:hidden}
.stagebox{position:relative;background:var(--floor)}
.curtain{height:38px;background:
  repeating-linear-gradient(90deg,var(--curtain-dark) 0,var(--curtain) 4px,var(--curtain-hi) 8px,var(--curtain) 12px,var(--curtain-dark) 16px);
  box-shadow:inset 0 -6px 10px -6px rgba(0,0,0,.35);border-bottom:4px solid #24308a}
.deck{height:50px;background:linear-gradient(180deg,var(--deck),#e8dcc4);border-bottom:9px solid var(--deck-front);
  border-radius:0 0 18px 18px;display:flex;align-items:center;justify-content:center;
  font-family:var(--display);font-weight:800;letter-spacing:.38em;font-size:13px;color:#8a7442;margin-inline:7%;
  box-shadow:0 8px 14px -8px rgba(0,0,0,.3)}
.stairs{position:absolute;top:42px;width:5%;height:59px;border-radius:0 0 10px 10px;
  background:repeating-linear-gradient(0deg,var(--stair) 0 6px,var(--stair-dark) 6px 8px)}
.stairs.l{left:1%} .stairs.r{right:1%}
/* il pavimento è il corridoio giallo, largo uguale ovunque; i blocchi sono isole grigie */
.floor{--gap:40px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--gap);padding:var(--gap)}
.pad{background:linear-gradient(180deg,var(--floor-hi),var(--floor));border:4px solid var(--aisle-edge);border-radius:18px;
  padding:7px;display:grid;gap:4px;box-shadow:0 10px 18px -12px rgba(80,60,0,.55)}
.blkname{font-family:var(--display);font-size:11px;color:#3d4458;text-align:center;letter-spacing:.14em;text-transform:uppercase;font-weight:800;padding-bottom:2px}
.prow{display:grid;grid-template-columns:11px repeat(8,minmax(0,1fr));gap:4px;align-items:center}
.pad.right .prow{grid-template-columns:repeat(8,minmax(0,1fr)) 11px}
.noseat{aspect-ratio:1/1.1}
.rowlbl{font-size:10px;color:#4a5164;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.door{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:88px;height:12px;background:var(--aisle)}
.door-lbl{display:flex;justify-content:center;margin-top:10px}
.door-lbl span{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  background:var(--surface-solid);border:1px solid var(--line);padding:4px 12px;border-radius:999px}

/* poltrona vista dall'alto: seduta + schienale in basso (il pubblico guarda il palco) + braccioli */
.seat{aspect-ratio:1/1.1;width:100%;max-width:100%;padding:0;border:0;cursor:pointer;position:relative;
  background:var(--seat);border-radius:5px 5px 3px 3px;
  box-shadow:inset 0 -6px 0 var(--seat-back), inset 2px 0 0 var(--seat-back), inset -2px 0 0 var(--seat-back), 0 2px 3px rgba(10,20,80,.25);
  transition:transform .15s, filter .15s}
.seat.taken{background:var(--seat-taken);
  box-shadow:inset 0 -6px 0 var(--seat-taken-back), inset 2px 0 0 var(--seat-taken-back), inset -2px 0 0 var(--seat-taken-back), 0 2px 3px rgba(10,20,80,.25)}
.seat.taken::after{content:"";position:absolute;left:50%;top:38%;width:34%;aspect-ratio:1;transform:translate(-50%,-50%);
  border-radius:50%;background:rgba(255,255,255,.6)}
.seat:hover,.seat:focus-visible{transform:translateY(-2px) scale(1.08);filter:brightness(1.12);outline:2px solid #fff;outline-offset:1px;z-index:1}
.seat.sel{outline:2.5px solid #fff;outline-offset:1px;filter:drop-shadow(0 0 5px rgba(255,255,255,.9))}
.seat.flash{animation:flash 1.1s}
@keyframes flash{0%,100%{filter:none;transform:none}35%{filter:brightness(1.9);transform:scale(1.18)}}
@media (prefers-reduced-motion:reduce){.seat{transition:none}.seat.flash{animation:none}}

.legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:8px;background:var(--surface-solid);border:1px solid var(--line);padding:5px 12px 5px 8px;border-radius:999px}
.legend .seat{width:16px;cursor:default;pointer-events:none}
.info{min-height:40px;margin-top:14px;font-size:14px;font-weight:700;display:flex;align-items:center}
.info:not(:empty){background:color-mix(in srgb,var(--accent) 10%,var(--surface-solid));border-radius:16px;padding:9px 14px}

/* ---------- foglio ---------- */
.sheet{border:1px solid var(--line);border-radius:20px;overflow:hidden;font-size:13.5px;background:var(--surface-solid)}
.sheet-head{display:flex;align-items:center;gap:8px;padding:10px 14px;background:color-mix(in srgb,#1e8e3e 14%,var(--surface-solid));border-bottom:1px solid var(--line);font-weight:700;font-size:13px}
.sheet-head .dot{width:14px;height:14px;border-radius:4px;background:linear-gradient(180deg,#34b85a,#1e8e3e)}
.sheet-scroll{max-height:310px;overflow:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:7px 14px;border-bottom:1px solid var(--line);text-align:left}
th{position:sticky;top:0;background:var(--surface-solid);font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
tbody tr:hover{background:color-mix(in srgb,var(--accent) 6%,transparent)}
td button{border:0;background:none;color:var(--muted);cursor:pointer;font:inherit;font-size:12px;padding:3px 9px;border-radius:999px}
td button:hover,td button:focus-visible{color:#fff;background:#e0465a;outline:none}
form{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) auto;gap:8px;margin-top:16px;align-items:end}
@media (max-width:420px){form{grid-template-columns:repeat(3,minmax(0,1fr))} form .add{grid-column:1/-1}}
label{font-size:12px;color:var(--muted);display:grid;gap:4px}
select,.add{font:inherit;font-size:14px;padding:9px 10px;border-radius:14px;border:1px solid var(--line);background:var(--surface-solid);color:var(--ink);min-width:0}
.add{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 80%,#fff),var(--accent));border-color:transparent;color:var(--accent-ink);
  font-weight:700;cursor:pointer;padding-inline:16px;box-shadow:0 8px 16px -8px var(--accent)}
.add:hover{filter:brightness(1.06)}
.add:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.msg{font-size:13px;color:var(--muted);min-height:20px;margin-top:10px}
.note{font-size:13px;color:var(--muted);margin:14px 0 0;max-width:65ch}
.prow{grid-template-columns:12px repeat(9,minmax(0,1fr))}
.pad.right .prow{grid-template-columns:repeat(9,minmax(0,1fr)) 12px}
.seat.wc{background:#e9eefc;box-shadow:inset 0 0 0 2px var(--seat);display:grid;place-items:center;color:var(--seat-back);font-size:11px;font-weight:700;border-radius:5px}
.wcarea{align-self:stretch;display:grid;place-items:center;border:2px dashed color-mix(in srgb,var(--seat) 55%,transparent);border-radius:6px;color:var(--seat-back);font-size:12px;font-style:normal;min-height:100%}
.exit{position:absolute;bottom:0;width:70px;height:12px;background:#2fae5b}
.exit.l{left:34px} .exit.r{right:34px}
.door-lbl{justify-content:space-between;gap:8px;flex-wrap:wrap}
.door-lbl .ex{color:#1f7a41}
form{grid-template-columns:repeat(2,minmax(0,1fr)) auto}
@media (max-width:420px){form{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>

<style>
.seat.ticket{background:#ef6a3a;box-shadow:inset 0 -6px 0 #b8431c, inset 2px 0 0 #b8431c, inset -2px 0 0 #b8431c, 0 2px 3px rgba(10,20,80,.25)}
.stat.k b{color:#d9552a}
.status{font-size:12.5px;color:var(--muted);margin-top:10px}
.status.err{color:#c0392b;font-weight:700}
.serata{display:grid;gap:4px;margin-bottom:16px;font-size:12px;color:var(--muted)}
.serata select{font:inherit;font-size:15px;font-weight:700;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--surface-solid);color:var(--ink);max-width:100%}
.btn{font:inherit;font-size:14px;font-weight:700;border:0;border-radius:14px;padding:10px 14px;cursor:pointer;color:#fff}
.btn:disabled{opacity:.5;cursor:wait}
.btn.abb{background:var(--seat-taken)} .btn.big{background:#ef6a3a} .btn.free{background:#e0465a} .btn.go{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sheetpanel{position:sticky;bottom:max(12px,env(safe-area-inset-bottom,0px));margin-top:14px;background:var(--surface-solid);border:1px solid var(--line);
  border-radius:22px;padding:14px 16px;box-shadow:0 16px 30px -18px rgba(20,30,90,.5);display:grid;gap:10px}
.sheetpanel h3{margin:0;font-family:var(--display);font-size:17px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fields .wide{grid-column:1/-1}
.fields label{font-size:12px;color:var(--muted);display:grid;gap:4px}
.fields input{font:inherit;font-size:15px;padding:9px 10px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-width:0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg label{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
.seg input{accent-color:var(--accent)}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.det{font-size:14px;line-height:1.6}
.det b{font-size:16px}
.login{max-width:380px;margin:40px auto;display:grid;gap:12px}
.login input{font:inherit;font-size:20px;letter-spacing:.3em;text-align:center;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--surface-solid);color:var(--ink)}
.elenco{margin-top:18px}
.elenco summary{cursor:pointer;font-weight:700}
.elenco table{border-collapse:collapse;width:100%;font-size:13.5px;margin-top:8px;font-variant-numeric:tabular-nums}
.elenco th,.elenco td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.elenco th{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="wrap" style="max-width:860px">
  <header class="topbar">
    <div>
      <span class="tag">Uso interno</span>
      <h1>Cassa posti</h1>
    </div>
    <button class="btn ghost" id="b-esci" type="button" hidden>Esci</button>
  </header>

  <section class="panel login" id="v-login" aria-labelledby="l-title">
    <h2 id="l-title">Accesso alla cassa</h2>
    <p class="sub" id="l-sub">Inserisci il PIN della cassa.</p>
    <form id="f-login" class="login" style="margin:0">
      <label for="pin" class="sub" style="margin:0">PIN</label>
      <input id="pin" type="password" inputmode="numeric" autocomplete="current-password" required>
      <label for="pin2" class="sub" id="l-pin2" style="margin:0" hidden>Ripeti il PIN</label>
      <input id="pin2" type="password" inputmode="numeric" autocomplete="new-password" hidden>
      <button class="btn go" type="submit" id="b-login">Entra</button>
      <div class="status" id="l-status" aria-live="polite"></div>
    </form>
  </section>

  <section class="panel" id="v-cassa" hidden aria-labelledby="map-title">
    <h2 id="map-title" hidden>Pianta della sala</h2>
    <label class="serata" for="serata">Serata<select id="serata"></select></label>
    <div class="stats">
      <div class="stat t"><b id="s-taken">–</b>abbonati</div>
      <div class="stat k"><b id="s-ticket">–</b>biglietti</div>
      <div class="stat f"><b id="s-free">–</b>liberi</div>
      <div class="stat"><b id="s-total">0</b>totali</div>
    </div>
    <div class="hall"><div class="room"><div class="inside">
      <div class="stagebox">
        <div class="curtain" aria-hidden="true"></div>
        <div class="deck">PALCO</div>
        <div class="stairs l" aria-hidden="true"></div>
        <div class="stairs r" aria-hidden="true"></div>
      </div>
      <div class="floor" id="floor"></div>
    </div>
    <div class="exit l" aria-hidden="true"></div><div class="door" aria-hidden="true"></div><div class="exit r" aria-hidden="true"></div></div>
    <div class="door-lbl"><span class="ex">Uscita di emergenza</span><span>↑ Ingresso</span><span class="ex">Uscita di emergenza</span></div></div>
    <div class="info" id="info" aria-live="polite"></div>
    <div class="sheetpanel" id="p-nuovo" hidden>
      <h3 id="n-title"></h3>
      <form id="f-nuovo" style="display:grid;gap:10px">
        <div class="seg" role="radiogroup" aria-label="Tipo">
          <label><input type="radio" name="tipo" value="Biglietto" checked> <span id="n-big">Biglietto</span></label>
          <label><input type="radio" name="tipo" value="Abbonato"> Abbonato (tutta la stagione)</label>
        </div>
        <div class="fields">
          <label for="n-nome">Nome<input id="n-nome" autocomplete="off" required></label>
          <label for="n-cognome">Cognome<input id="n-cognome" autocomplete="off" required></label>
          <label for="n-note" class="wide">Note (facoltative)<input id="n-note" autocomplete="off"></label>
        </div>
        <div class="row-btns">
          <button class="btn go" type="submit" id="n-salva">Salva</button>
          <button class="btn ghost" type="button" data-chiudi>Annulla</button>
        </div>
      </form>
    </div>
    <div class="sheetpanel" id="p-occ" hidden>
      <h3 id="o-title"></h3>
      <div class="det" id="o-det"></div>
      <div class="row-btns">
        <button class="btn free" type="button" id="o-libera">Libera posto</button>
        <button class="btn ghost" type="button" data-chiudi>Chiudi</button>
      </div>
    </div>
    <div class="legend">
      <span><i class="seat" aria-hidden="true"></i>Libero</span>
      <span><i class="seat taken" aria-hidden="true"></i>Abbonato</span>
      <span><i class="seat taken ticket" aria-hidden="true"></i>Biglietto</span>
      <span><i class="wcarea" aria-hidden="true" style="width:22px;height:16px;font-size:9px">♿</i>Spazio carrozzine</span>
    </div>
    <div class="status" id="status">Caricamento dei posti…</div>
    <details class="elenco">
      <summary>Elenco della serata</summary>
      <div style="overflow-x:auto"><table><thead><tr><th>Posto</th><th>Nome</th><th>Tipo</th><th>Note</th></tr></thead><tbody id="elenco"></tbody></table></div>
    </details>
  </section>
</div>
<script>
const API_URL = "https://script.google.com/macros/s/AKfycbzisQlwL11LmrBvTvFwmUmicQejjIrzNRNKE8zuz079xv2HMo6oD_Z6b9sQn_5tWXJD2A/exec";
const PUBBLICO=false;
/* ===== CONFIGURAZIONE DELLA SALA (dalla pianta ufficiale) ===== */
const COLS=9;
const range=(a,b)=>Array.from({length:b-a+1},(_,i)=>a+i);
const FRONT="ABCDEFGH".split(""), BACK="ILMNOPQR".split("");
const ROWS={};
[...FRONT,...BACK].forEach(r=>ROWS[r]={left:range(1,9),right:range(10,18)});
ROWS.A={left:range(1,5),right:range(6,10),wc:true}; // gli spazi vuoti della fila A sono per le carrozzine
const ALLROWS=[...FRONT,...BACK];
const seatsOf=r=>[...ROWS[r].left,...ROWS[r].right];
const TOTAL=ALLROWS.reduce((t,r)=>t+seatsOf(r).length,0);
const key=(r,n)=>r+"-"+n;
const blockOf=(r,n)=>(BACK.includes(r)?2:0)+(n>=10||(r==="A"&&n>=6)?2:1);
const $=id=>document.getElementById(id);

/* ===== DATI ===== */
let righe=[], spettacoli=[], serata="";       // serata = data scelta (aaaa-mm-gg)
let occupati=new Map();                        // "B-5" -> riga del foglio
const MESI=["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"];
const GIORNI=["dom","lun","mar","mer","gio","ven","sab"];
function dataLunga(iso){if(!iso)return"";const [y,m,d]=iso.split("-").map(Number);const dt=new Date(y,m-1,d);return `${GIORNI[dt.getDay()]} ${d} ${MESI[m-1]} ${y}`}
function oggiIso(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}

function calcolaOccupati(){
  occupati=new Map();
  righe.forEach(x=>{
    if(!ROWS[x.fila]||!seatsOf(x.fila).includes(x.posto))return;
    if(x.tipo==="Abbonato"||x.spettacolo===serata)occupati.set(key(x.fila,x.posto),x);
  });
}
function riempiSerate(){
  const sel=$("serata"), prima=serata;
  sel.innerHTML="";
  spettacoli.forEach(s=>sel.add(new Option(`${dataLunga(s.data)}${s.titolo?" · "+s.titolo:""}`,s.data)));
  if(spettacoli.some(s=>s.data===prima))serata=prima;
  else{const f=spettacoli.find(s=>s.data>=oggiIso());serata=f?f.data:(spettacoli.length?spettacoli[spettacoli.length-1].data:"")}
  sel.value=serata;
}

/* ===== PIANTA ===== */
const floor=$("floor"), seatEls={};
const el=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt)e.textContent=txt;return e};
function makePad(rows,side,blk){
  const right=side==="right";
  const pad=el("div","pad"+(right?" right":""));
  pad.setAttribute("aria-label","Blocco "+blk);pad.setAttribute("role","group");
  rows.forEach(r=>{
    const row=el("div","prow"), list=ROWS[r][side], empty=COLS-list.length;
    const gap=()=>{if(!empty)return;if(ROWS[r].wc){const a=el("span","wcarea","♿");a.style.gridColumn="span "+empty;a.title="Spazio carrozzine";row.appendChild(a)}else for(let i=0;i<empty;i++)row.appendChild(el("span","noseat"))};
    if(!right)row.appendChild(el("span","rowlbl",r));
    if(!right)gap();
    list.forEach(n=>{
      const s=el("button","seat");s.type="button";
      s.addEventListener("click",()=>onSeat(r,n));
      seatEls[key(r,n)]=s;row.appendChild(s);
    });
    if(right)gap();
    if(right)row.appendChild(el("span","rowlbl",r));
    pad.appendChild(row);
  });
  return pad;
}
floor.append(makePad(FRONT,"left",1),makePad(FRONT,"right",2),makePad(BACK,"left",3),makePad(BACK,"right",4));
$("s-total").textContent=TOTAL;

let selected=null;
function select(r,n){if(selected)selected.classList.remove("sel");selected=r?seatEls[key(r,n)]:null;if(selected)selected.classList.add("sel")}
function flash(r,n){const s=seatEls[key(r,n)];if(!s)return;s.classList.remove("flash");void s.offsetWidth;s.classList.add("flash")}
function render(){
  calcolaOccupati();
  Object.entries(seatEls).forEach(([k,s])=>{
    const t=occupati.get(k), [r,n]=k.split("-");
    s.classList.toggle("taken",!!t);
    s.classList.toggle("ticket",!!t&&t.tipo==="Biglietto"&&!PUBBLICO);
    s.setAttribute("aria-label",`Fila ${r}, posto ${n}, ${t?(PUBBLICO?"occupato":(t.tipo==="Biglietto"?"biglietto":"abbonato")):"libero"}`);
  });
  const abb=[...occupati.values()].filter(t=>t.tipo==="Abbonato").length;
  if($("s-taken"))$("s-taken").textContent=abb;
  if($("s-ticket"))$("s-ticket").textContent=occupati.size-abb;
  $("s-free").textContent=TOTAL-occupati.size;
  if(typeof dopoRender==="function")dopoRender();
}
const statusEl=$("status");
function setStatus(t,err){statusEl.textContent=t;statusEl.className="status"+(err?" err":"")}
const ora=()=>new Date().toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"});
function applicaDati(d){righe=d.posti||[];spettacoli=d.spettacoli||[];riempiSerate();render()}
$("serata").addEventListener("change",e=>{serata=e.target.value;select(null);if(typeof chiudi==="function")chiudi();render()});


let PIN="", corrente=null, primoPin=false;
try{PIN=sessionStorage.getItem("pin_cassa")||""}catch(e){}
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function api(body){
  const res=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({pin:PIN},body))});
  return res.json();
}
function mostraCassa(on){$("v-login").hidden=on;$("v-cassa").hidden=!on;$("b-esci").hidden=!on}
function modoPrimoPin(on){
  primoPin=on;$("pin2").hidden=!on;$("l-pin2").hidden=!on;$("pin2").required=on;
  $("l-sub").textContent=on?"Prima volta: scegli un PIN di almeno 6 cifre per la cassa e conservalo.":"Inserisci il PIN della cassa.";
  $("b-login").textContent=on?"Imposta PIN":"Entra";
}
async function entra(){
  const ls=$("l-status");ls.textContent="Verifica…";ls.className="status";
  try{
    const d=await api({azione:"leggi"});
    if(d.ok){try{sessionStorage.setItem("pin_cassa",PIN)}catch(e){}mostraCassa(true);applicaDati(d);setStatus(`Aggiornato alle ${ora()}.`);return}
    if(d.codice==="NESSUN_PIN"){modoPrimoPin(true);ls.textContent="";return}
    PIN="";try{sessionStorage.removeItem("pin_cassa")}catch(e){}
    mostraCassa(false);ls.textContent=d.errore||"Accesso non riuscito";ls.className="status err";
  }catch(e){ls.textContent="Non riesco a contattare il foglio. Controlla la connessione.";ls.className="status err"}
}
$("f-login").addEventListener("submit",async e=>{
  e.preventDefault();
  const p=$("pin").value.trim(), ls=$("l-status");
  if(primoPin){
    if(!/^\d{6,}$/.test(p)){ls.textContent="Il PIN deve avere almeno 6 cifre.";ls.className="status err";return}
    if(p!==$("pin2").value.trim()){ls.textContent="I due PIN non coincidono.";ls.className="status err";return}
    try{const d=await api({azione:"impostaPin",pin:p});if(!d.ok){ls.textContent=d.errore;ls.className="status err";return}}
    catch(err){ls.textContent="Non riesco a contattare il foglio.";ls.className="status err";return}
    modoPrimoPin(false);
  }
  PIN=p;$("pin").value="";$("pin2").value="";entra();
});
$("b-esci").onclick=()=>{PIN="";try{sessionStorage.removeItem("pin_cassa")}catch(e){}chiudi();mostraCassa(false);modoPrimoPin(false);$("l-status").textContent=""};

function chiudi(){$("p-nuovo").hidden=true;$("p-occ").hidden=true;corrente=null;select(null);$("o-libera").dataset.conferma=""}
document.querySelectorAll("[data-chiudi]").forEach(b=>b.onclick=chiudi);
function onSeat(r,n){
  if(!serata){setStatus("Aggiungi almeno una serata nel foglio Spettacoli.",true);return}
  select(r,n);corrente={r,n};$("info").textContent="";
  const t=occupati.get(key(r,n));
  $("o-libera").dataset.conferma="";$("o-libera").textContent="Libera posto";
  if(t){
    $("p-nuovo").hidden=true;$("p-occ").hidden=false;
    $("o-title").textContent=`Fila ${r} · Posto ${n}`;
    $("o-det").innerHTML=`<b>${esc(t.nome)} ${esc(t.cognome)}</b><br>${t.tipo==="Abbonato"?"Abbonato · tutta la stagione":"Biglietto · "+esc(dataLunga(t.spettacolo))}`+
      (t.registrato?`<br>Registrato il ${esc(dataLunga(t.registrato))}`:"")+(t.note?`<br>Note: ${esc(t.note)}`:"");
  }else{
    $("p-occ").hidden=true;$("p-nuovo").hidden=false;
    $("n-title").textContent=`Fila ${r} · Posto ${n} · libero`;
    $("n-big").textContent=`Biglietto per ${dataLunga(serata)}`;
    $("f-nuovo").reset();setTimeout(()=>$("n-nome").focus(),50);
  }
}
async function esegui(body,okMsg){
  const {r,n}=corrente;
  document.querySelectorAll(".sheetpanel .btn").forEach(b=>b.disabled=true);
  setStatus("Salvataggio…");
  try{
    const d=await api(Object.assign({fila:r,posto:n},body));
    if(d.codice&&d.codice!=="OK"&&!d.posti){setStatus(d.errore,true);if(d.codice==="PIN_ERRATO"||d.codice==="BLOCCATO")$("b-esci").click();return}
    if(d.posti)applicaDati(d);
    if(!d.ok){setStatus(d.errore||"Errore nel salvataggio",true);return}
    setStatus(`Salvato alle ${ora()}.`);flash(r,n);$("info").textContent=okMsg;chiudi();
  }catch(e){setStatus("Non sono riuscito a salvare. Controlla la connessione e riprova.",true)}
  finally{document.querySelectorAll(".sheetpanel .btn").forEach(b=>b.disabled=false)}
}
$("f-nuovo").addEventListener("submit",e=>{
  e.preventDefault();
  const tipo=document.querySelector('input[name="tipo"]:checked').value;
  const nome=$("n-nome").value.trim(), cognome=$("n-cognome").value.trim();
  esegui({azione:"aggiungi",tipo,spettacolo:serata,nome,cognome,note:$("n-note").value.trim()},
    `Fila ${corrente.r} · Posto ${corrente.n}: ${tipo==="Abbonato"?"abbonato":"biglietto"} di ${nome} ${cognome}`);
});
$("o-libera").onclick=()=>{
  const b=$("o-libera");
  if(!b.dataset.conferma){b.dataset.conferma="1";b.textContent="Conferma: libera il posto";return}
  const t=occupati.get(key(corrente.r,corrente.n));
  esegui({azione:"togli",tipo:t.tipo,spettacolo:t.spettacolo},`Fila ${corrente.r} · Posto ${corrente.n}: liberato`);
};
function dopoRender(){
  const ord=(a,b)=>ALLROWS.indexOf(a.fila)-ALLROWS.indexOf(b.fila)||a.posto-b.posto;
  $("elenco").innerHTML=[...occupati.values()].sort(ord).map(x=>
    `<tr><td>${x.fila}${x.posto}</td><td>${esc(x.nome)} ${esc(x.cognome)}</td><td>${x.tipo}</td><td>${esc(x.note)}</td></tr>`).join("")||
    `<tr><td colspan="4">Nessun posto occupato in questa serata.</td></tr>`;
}
async function aggiorna(){
  if(!PIN||corrente||$("v-cassa").hidden)return;
  try{const d=await api({azione:"leggi"});if(d.ok){applicaDati(d);setStatus(`Aggiornato alle ${ora()}.`)}}catch(e){}
}
render();
if(PIN)entra();
setInterval(aggiorna,20000);

</script>
</body>
</html>
