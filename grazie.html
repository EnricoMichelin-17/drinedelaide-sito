<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Messaggio inviato · Drin e Delaide</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=ABeeZee&display=swap">
<style>
:root{--stage:#0A0808;--ivory:#EBD6D4;--muted:#BFA7A5;--red:#B63E3E}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--stage);color:var(--ivory);font-family:"ABeeZee","Segoe UI",system-ui,sans-serif;padding:24px;text-align:center}
main{display:grid;gap:20px;justify-items:center;max-width:36rem}
h1{font-family:"Baloo 2","Trebuchet MS",sans-serif;font-weight:800;text-transform:uppercase;font-size:clamp(2.4rem,7vw,4rem);line-height:1;margin:0}
p{color:var(--muted);margin:0;font-size:1.1rem}
a{display:inline-flex;align-items:center;min-height:48px;padding:12px 24px;border-radius:999px;background:var(--red);color:#fff;text-decoration:none;font-weight:600}
</style>
</head>
<body>
<main>
<h1>Grazie!</h1>
<p>Abbiamo ricevuto il tuo messaggio. Ti risponderemo il prima possibile.</p>
<a href="/">Torna al sito</a>
</main>
</body>
</html>
